name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm pack --dry-run
      - run: bun scripts/build-standalone.mjs --all
      - run: node scripts/package-standalone.mjs
      - run: node scripts/generate-homebrew-cask.mjs --out dist/release/swap3d.rb
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: swap3d-linux-x64.tar.gz
            binary: swap3d
          - os: ubuntu-24.04-arm
            archive: swap3d-linux-arm64.tar.gz
            binary: swap3d
          - os: macos-15-intel
            archive: swap3d-darwin-x64.tar.gz
            binary: swap3d
          - os: macos-15
            archive: swap3d-darwin-arm64.tar.gz
            binary: swap3d
          - os: windows-latest
            archive: swap3d-windows-x64.zip
            binary: swap3d.exe
          - os: windows-11-arm
            archive: swap3d-windows-arm64.zip
            binary: swap3d.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - shell: bash
        run: node scripts/verify-checksum.mjs dist/release/SHA256SUMS "dist/release/${{ matrix.archive }}"
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/smoke
          tar -xzf "dist/release/${{ matrix.archive }}" -C dist/smoke
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/release/${{ matrix.archive }}" -DestinationPath dist/smoke
      - shell: bash
        run: "./dist/smoke/${{ matrix.binary }} --version"
      - shell: bash
        run: "./dist/smoke/${{ matrix.binary }} formats --offline"

  github-release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Swap3D CLI ${GITHUB_REF_NAME}"
          fi

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish npm package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@swap3d/cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@swap3d/cli@${PACKAGE_VERSION} is already published."
          else
            npm publish --access public
          fi
